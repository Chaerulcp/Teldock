<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Teldock architecture</title>
  <desc id="archDesc">The React SPA talks to the Express API, which streams file parts to the Telegram Bot API and stores only metadata in MySQL. The backend is layered as routes, controllers, services and models.</desc>

  <rect width="1200" height="430" rx="26" fill="#0e1116"/>

  <text x="56" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.8" fill="#8592a6">ARCHITECTURE</text>

  <g id="flow">
    <rect x="56" y="92" width="250" height="112" rx="14" fill="#131d24" stroke="#24313a"/>
    <rect x="56" y="92" width="4" height="112" rx="2" fill="#10b981"/>
    <text x="80" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#e7eef2">React SPA</text>
    <text x="80" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">Vite · Tailwind</text>
    <text x="80" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">Zustand · Router</text>

    <path d="M306 148 h44" stroke="#3a4150" stroke-width="2"/>
    <polygon points="358,148 348,142 348,154" fill="#3a4150"/>
    <polygon points="298,148 308,142 308,154" fill="#3a4150"/>
    <text x="328" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#66748c">REST</text>

    <rect x="366" y="92" width="250" height="112" rx="14" fill="#131d24" stroke="#24313a"/>
    <rect x="366" y="92" width="4" height="112" rx="2" fill="#10b981"/>
    <text x="390" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#e7eef2">Express API</text>
    <text x="390" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">Node 22 · JWT</text>
    <text x="390" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">Zod · Socket.IO</text>

    <path d="M616 148 h44" stroke="#3a4150" stroke-width="2"/>
    <polygon points="668,148 658,142 658,154" fill="#3a4150"/>
    <polygon points="608,148 618,142 618,154" fill="#3a4150"/>
    <text x="638" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#66748c">parts</text>

    <rect x="676" y="92" width="250" height="112" rx="14" fill="#0b2b3a" stroke="#1d5f80"/>
    <rect x="676" y="92" width="4" height="112" rx="2" fill="#229ED9"/>
    <text x="700" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#e7eef2">Telegram Bot API</text>
    <text x="700" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7cc9ee">your private channel</text>
    <text x="700" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7cc9ee">file bytes live here</text>

    <rect x="956" y="92" width="188" height="112" rx="14" fill="#131d24" stroke="#24313a"/>
    <rect x="956" y="92" width="4" height="112" rx="2" fill="#10b981"/>
    <text x="980" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#e7eef2">MySQL</text>
    <text x="980" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">metadata only</text>
    <text x="980" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66748c">Sequelize</text>

    <path d="M491 204 v34 h-119 v24" stroke="#3a4150" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
    <path d="M1050 204 v34 h-559 v24" stroke="#3a4150" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
    <text x="500" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#66748c">metadata + signed URLs</text>
  </g>

  <g id="layers" transform="translate(56 292)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.6" fill="#8592a6">BACKEND LAYERS</text>
    <g transform="translate(0 18)">
      <rect x="0" y="0" width="118" height="40" rx="10" fill="#131d24" stroke="#24313a"/>
      <text x="59" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e7eef2">routes</text>
      <path d="M126 20 h20" stroke="#3a4150" stroke-width="2"/><polygon points="152,20 144,15 144,25" fill="#3a4150"/>
      <rect x="160" y="0" width="150" height="40" rx="10" fill="#131d24" stroke="#24313a"/>
      <text x="235" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e7eef2">controllers</text>
      <path d="M318 20 h20" stroke="#3a4150" stroke-width="2"/><polygon points="344,20 336,15 336,25" fill="#3a4150"/>
      <rect x="352" y="0" width="118" height="40" rx="10" fill="#131d24" stroke="#24313a"/>
      <text x="411" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e7eef2">services</text>
      <path d="M478 20 h20" stroke="#3a4150" stroke-width="2"/><polygon points="504,20 496,15 496,25" fill="#3a4150"/>
      <rect x="512" y="0" width="118" height="40" rx="10" fill="#131d24" stroke="#24313a"/>
      <text x="571" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e7eef2">models</text>
    </g>
    <g transform="translate(0 78)">
      <circle cx="4" cy="0" r="4" fill="#10b981"/>
      <text x="18" y="6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8592a6">Chunked upload and streaming download — the server never writes file bytes to disk.</text>
    </g>
  </g>
</svg>
